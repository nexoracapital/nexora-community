<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VoltWealth - CEO Admin Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen flex flex-col font-sans selection:bg-amber-400 selection:text-black">

  <header class="sticky top-0 z-40 bg-slate-900/95 border-b border-slate-800 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-500 via-rose-500 to-indigo-500 p-[2px] flex items-center justify-center">
        <div class="w-full h-full bg-[#030712] rounded-[9px] flex items-center justify-center">
          <i class="fa-solid fa-crown text-amber-400 text-xs"></i>
        </div>
      </div>
      <span class="text-lg font-black italic tracking-wider font-brand text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-rose-300 to-indigo-400">
        VOLT<span class="text-white">CORE</span>
      </span>
      <span class="text-[9px] bg-amber-400/10 text-amber-400 border border-amber-400/30 px-2 py-0.5 rounded-full font-bold uppercase ml-2">CEO Mode</span>
    </div>
    <button onclick="ceoLogout()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs font-bold px-3 py-1 rounded-full transition">
      Exit
    </button>
  </header>

  <main class="max-w-4xl mx-auto w-full px-4 py-6 space-y-6 flex-1">
    
    <!-- Metrics -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
        <div class="text-[10px] uppercase font-bold text-slate-400">Total Deposits</div>
        <div class="text-xl font-black font-brand text-emerald-400 mt-1">$48,290.00</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
        <div class="text-[10px] uppercase font-bold text-slate-400">Pending Payouts</div>
        <div id="pendingCountDisplay" class="text-xl font-black font-brand text-amber-400 mt-1">$1,240.00</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
        <div class="text-[10px] uppercase font-bold text-slate-400">Active Nodes</div>
        <div class="text-xl font-black font-brand text-cyan-400 mt-1">1,489</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
        <div class="text-[10px] uppercase font-bold text-slate-400">Vault Balance</div>
        <div class="text-xl font-black font-brand text-indigo-400 mt-1">$92,600.00</div>
      </div>
    </div>

    <!-- Withdrawal Management -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
      <h3 class="text-sm font-bold text-white mb-3 flex items-center space-x-2">
        <i class="fa-solid fa-hand-holding-dollar text-amber-400"></i>
        <span>Pending Withdrawal Requests (Min $20)</span>
      </h3>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="bg-slate-950 text-slate-400 text-[10px] uppercase border-b border-slate-800">
            <tr>
              <th class="py-2 px-3">User</th>
              <th class="py-2 px-3">Amount</th>
              <th class="py-2 px-3">Wallet</th>
              <th class="py-2 px-3 text-right">Action</th>
            </tr>
          </thead>
          <tbody id="payoutList" class="divide-y divide-slate-800">
            <tr id="req-1">
              <td class="py-2.5 px-3 font-semibold text-white">Hamza Tariq</td>
              <td class="py-2.5 px-3 text-amber-400 font-bold">$150.00</td>
              <td class="py-2.5 px-3 font-mono text-[10px] text-slate-400">TX9yZae...8z1P</td>
              <td class="py-2.5 px-3 text-right space-x-1">
                <button onclick="approve('req-1', 150)" class="bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500 hover:text-black px-2 py-0.5 rounded text-[10px] font-bold">Approve</button>
                <button onclick="reject('req-1')" class="bg-rose-500/20 text-rose-400 hover:bg-rose-500 hover:text-white px-2 py-0.5 rounded text-[10px] font-bold">Reject</button>
              </td>
            </tr>
            <tr id="req-2">
              <td class="py-2.5 px-3 font-semibold text-white">Sarmad Bilal</td>
              <td class="py-2.5 px-3 text-amber-400 font-bold">$45.00</td>
              <td class="py-2.5 px-3 font-mono text-[10px] text-slate-400">TReq87X...91Lq</td>
              <td class="py-2.5 px-3 text-right space-x-1">
                <button onclick="approve('req-2', 45)" class="bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500 hover:text-black px-2 py-0.5 rounded text-[10px] font-bold">Approve</button>
                <button onclick="reject('req-2')" class="bg-rose-500/20 text-rose-400 hover:bg-rose-500 hover:text-white px-2 py-0.5 rounded text-[10px] font-bold">Reject</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    if (sessionStorage.getItem('volt_auth_role') !== 'CEO') {
      window.location.href = 'index.html';
    }

    function approve(id, amt) {
      if (confirm(`Authorize blockchain payout of $${amt}.00 USDT?`)) {
        document.getElementById(id).remove();
        alert(`Payout of $${amt}.00 approved successfully.`);
      }
    }

    function reject(id) {
      if (confirm('Reject this payout request? Funds will refund to user.')) {
        document.getElementById(id).remove();
        alert('Payout request rejected.');
      }
    }

    function ceoLogout() {
      sessionStorage.clear();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
