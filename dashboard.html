<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VoltWealth - Home Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; touch-action: manipulation; }
    .font-brand { font-family: 'Space Grotesk', sans-serif; }
    .glow-gold { box-shadow: 0 0 25px rgba(245, 158, 11, 0.25); }
    .glow-card { box-shadow: 0 0 18px rgba(16, 185, 129, 0.15); }
  </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen flex flex-col justify-between pb-24 selection:bg-amber-400 selection:text-black">

  <!-- Top Bar -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-500 via-emerald-400 to-cyan-400 p-[2px] flex items-center justify-center">
        <div class="w-full h-full bg-[#030712] rounded-[9px] flex items-center justify-center">
          <i class="fa-solid fa-bolt text-amber-400 text-xs"></i>
        </div>
      </div>
      <span class="text-lg font-black italic tracking-wider font-brand text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-emerald-300 to-cyan-400">
        VOLT<span class="text-white">WEALTH</span>
      </span>
    </div>
    <div class="flex items-center space-x-2">
      <div class="bg-slate-800 border border-slate-700 px-3 py-1 rounded-full text-[11px] text-slate-300 font-semibold">
        <span id="navUserDisplay">Investor</span>
      </div>
      <button onclick="logout()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-[10px] font-bold px-2.5 py-1 rounded-full transition">
        <i class="fa-solid fa-power-off"></i>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-md mx-auto w-full px-4 py-4 space-y-4">

    <!-- Hero Announcement Card -->
    <div class="bg-gradient-to-br from-slate-900 via-indigo-950/40 to-slate-900 border border-emerald-500/30 rounded-2xl p-5 shadow-lg relative overflow-hidden glow-gold">
      <div class="flex items-center justify-between">
        <span class="text-[9px] font-extrabold uppercase tracking-wider text-amber-300 bg-amber-400/10 px-2.5 py-0.5 rounded-full border border-amber-400/20">
          Volt Core v2.4
        </span>
        <span class="text-[10px] text-emerald-400 font-bold">256-Bit SSL Live</span>
      </div>

      <div class="mt-3">
        <div class="text-[10px] text-slate-400 uppercase font-semibold">Available Balance</div>
        <div class="text-3xl font-black text-amber-400 font-brand mt-0.5">
          <span id="homeBalanceDisplay">$0.00</span>
          <span class="text-xs text-slate-400 font-sans">USDT</span>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 mt-4 pt-3 border-t border-slate-800">
        <a href="me.html" class="bg-amber-400 hover:bg-amber-300 text-black text-xs font-black py-2 rounded-xl text-center uppercase tracking-wider transition">
          Recharge
        </a>
        <a href="me.html" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold py-2 rounded-xl text-center uppercase tracking-wider border border-slate-700 transition">
          Withdraw ($20+)
        </a>
      </div>
    </div>

    <!-- Daily Attendance Reward Section -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between">
      <div class="flex justify-between items-center mb-2">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-calendar-check text-emerald-400 text-base"></i>
          <h3 class="text-xs font-bold text-white">Daily Dividend Check-In</h3>
        </div>
        <span class="text-[9px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded font-bold">+$0.50 USDT</span>
      </div>
      <p class="text-[11px] text-slate-400 mb-3">Claim your free node reward once every 24 hours.</p>

      <button id="checkinBtn" onclick="claimDaily()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-2 rounded-xl text-xs uppercase tracking-wider transition">
        Claim $0.50 Reward
      </button>
      <p id="checkinNotice" class="text-[10px] text-slate-500 text-center mt-2 hidden"></p>
    </div>

    <!-- Quick Links Grid -->
    <div class="grid grid-cols-2 gap-3">
      <a href="vip.html" class="bg-slate-900/90 border border-slate-800 hover:border-amber-400/50 p-4 rounded-2xl flex flex-col items-center justify-center space-y-2 transition glow-card">
        <div class="w-10 h-10 rounded-xl bg-amber-400/10 text-amber-400 flex items-center justify-center text-lg">
          <i class="fa-solid fa-gem"></i>
        </div>
        <span class="text-xs font-bold text-white font-brand">VIP Nodes (35%)</span>
        <span class="text-[9px] text-slate-400">Starter to Pro</span>
      </a>

      <a href="team.html" class="bg-slate-900/90 border border-slate-800 hover:border-cyan-400/50 p-4 rounded-2xl flex flex-col items-center justify-center space-y-2 transition glow-card">
        <div class="w-10 h-10 rounded-xl bg-cyan-400/10 text-cyan-400 flex items-center justify-center text-lg">
          <i class="fa-solid fa-users"></i>
        </div>
        <span class="text-xs font-bold text-white font-brand">Team (7%-3%-1%)</span>
        <span class="text-[9px] text-slate-400">Multi-Tier Rebates</span>
      </a>
    </div>

  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur border-t border-slate-800 px-6 py-2.5">
    <div class="max-w-md mx-auto flex justify-between items-center text-[10px] font-medium text-slate-400">
      <a href="dashboard.html" class="flex flex-col items-center space-y-1 text-amber-400 font-bold transition">
        <i class="fa-solid fa-house text-base"></i>
        <span>Home</span>
      </a>
      <a href="team.html" class="flex flex-col items-center space-y-1 hover:text-amber-400 transition">
        <i class="fa-solid fa-users text-base"></i>
        <span>Team</span>
      </a>
      <a href="vip.html" class="flex flex-col items-center space-y-1 hover:text-amber-400 transition">
        <div class="w-9 h-9 rounded-full bg-amber-400 text-black flex items-center justify-center -mt-4 shadow-lg shadow-amber-400/30">
          <i class="fa-solid fa-gem text-base"></i>
        </div>
        <span>VIP</span>
      </a>
      <a href="me.html" class="flex flex-col items-center space-y-1 hover:text-amber-400 transition">
        <i class="fa-solid fa-circle-user text-base"></i>
        <span>Profile</span>
      </a>
    </div>
  </nav>

  <script>
    const user = JSON.parse(sessionStorage.getItem('volt_active_session'));
    if (!user) {
      window.location.href = 'index.html';
    }
    document.getElementById('navUserDisplay').innerText = user.name || 'Investor';

    let balance = parseFloat(localStorage.getItem('volt_balance')) || 0.00;
    function updateUI() {
      document.getElementById('homeBalanceDisplay').innerText = `$${balance.toFixed(2)}`;
      localStorage.setItem('volt_balance', balance.toString());

      const lastClaim = localStorage.getItem('volt_last_claim');
      if (lastClaim) {
        const diff = (Date.now() - parseInt(lastClaim)) / (1000 * 60 * 60);
        const btn = document.getElementById('checkinBtn');
        const notice = document.getElementById('checkinNotice');
        if (diff < 24) {
          btn.disabled = true;
          btn.classList.add('opacity-50', 'cursor-not-allowed');
          btn.innerText = 'Claimed for Today';
          notice.classList.remove('hidden');
          notice.innerText = `Next claim in ~${Math.ceil(24 - diff)} hours`;
        }
      }
    }
    updateUI();

    function claimDaily() {
      balance += 0.50;
      localStorage.setItem('volt_last_claim', Date.now().toString());
      alert('+$0.50 added to your account balance!');
      updateUI();
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
