<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VoltWealth - Institutional Smart Yield</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      touch-action: manipulation;
    }
    .font-brand {
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Logo Flag-Waving Animation */
    @keyframes flagWave {
      0%, 100% {
        transform: perspective(400px) rotateY(0deg) skewY(0deg) translateY(0);
      }
      25% {
        transform: perspective(400px) rotateY(15deg) skewY(2deg) translateY(-2px);
      }
      50% {
        transform: perspective(400px) rotateY(-8deg) skewY(-2deg) translateY(2px);
      }
      75% {
        transform: perspective(400px) rotateY(10deg) skewY(1deg) translateY(-1px);
      }
    }
    .logo-wave {
      transform-origin: left center;
      animation: flagWave 4.5s ease-in-out infinite;
      will-change: transform;
    }

    /* Compact Card Neon Glowing Border */
    @keyframes neonPulse {
      0%, 100% {
        box-shadow: 0 0 18px rgba(16, 185, 129, 0.4), 0 0 35px rgba(245, 158, 11, 0.2);
        border-color: rgba(16, 185, 129, 0.85);
      }
      50% {
        box-shadow: 0 0 28px rgba(245, 158, 11, 0.55), 0 0 50px rgba(16, 185, 129, 0.35);
        border-color: rgba(245, 158, 11, 0.9);
      }
    }
    .compact-glow-border {
      animation: neonPulse 3.5s infinite ease-in-out;
    }

    /* Very Slow Smooth Ticker Animation */
    @keyframes scrollTickerSlow {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .ticker-content {
      display: inline-block;
      white-space: nowrap;
      animation: scrollTickerSlow 45s linear infinite; /* رفتار بہت سلو رکھی گئی ہے */
    }
    .ticker-content:hover {
      animation-play-state: paused;
    }

    /* Smooth Slide Switch */
    .view-slider {
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen w-screen overflow-x-hidden flex flex-col justify-between items-center py-5 px-3 selection:bg-amber-400 selection:text-black">

  <!-- ================= TOP BRAND HEADER (Spaced & Prominent) ================= -->
  <header class="text-center select-none pt-4 flex flex-col items-center">
    <div class="inline-flex items-center space-x-3 mb-1">
      
      <!-- Flag Waving SVG Logo -->
      <div class="logo-wave w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 via-emerald-400 to-cyan-400 p-[2.5px] shadow-lg shadow-emerald-500/25 flex items-center justify-center">
        <div class="w-full h-full bg-[#030712] rounded-[13px] flex items-center justify-center relative overflow-hidden">
          <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 3L11 19L14 12L20 21" stroke="url(#logoGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M13 3L8 15" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/>
            <defs>
              <linearGradient id="logoGrad" x1="4" y1="3" x2="20" y2="21" gradientUnits="userSpaceOnUse">
                <stop stop-color="#34D399"/>
                <stop offset="0.5" stop-color="#10B981"/>
                <stop offset="1" stop-color="#F59E0B"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
      </div>

      <h1 class="text-3xl sm:text-4xl font-black italic tracking-wider font-brand text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-emerald-300 to-cyan-400">
        VOLT<span class="text-white">WEALTH</span>
      </h1>
    </div>
    <p class="text-[10px] uppercase tracking-[0.25em] text-slate-400 font-bold">Smart Yield &amp; Digital Assets</p>
  </header>

  <!-- ================= LIVE ACTIVITY TICKER BAR (Slowed Down & Spaced) ================= -->
  <div class="w-full max-w-[350px] bg-slate-900/90 border border-slate-800/90 rounded-xl px-3 py-2 overflow-hidden flex items-center space-x-2.5 shadow-inner mt-4 mb-2">
    <div class="flex items-center space-x-1.5 text-amber-400 text-[10px] font-black uppercase tracking-wider shrink-0 bg-amber-400/10 px-2 py-0.5 rounded border border-amber-400/30">
      <i class="fa-solid fa-bolt-lightning text-[9px] animate-pulse"></i>
      <span>Live</span>
    </div>
    <div class="overflow-hidden relative w-full text-[11px] text-slate-300">
      <div id="liveTicker" class="ticker-content font-medium">
        Syncing decentralized node operations...
      </div>
    </div>
  </div>

  <!-- ================= COMPACT INTERACTIVE CARD ================= -->
  <main class="w-full max-w-[350px] my-auto">
    <div class="relative bg-white rounded-2xl shadow-2xl overflow-hidden text-slate-900 border-2 compact-glow-border">
      
      <div id="sliderWrapper" class="view-slider flex w-[200%]">

        <!-- ================= PANEL 1: LOGIN ================= -->
        <div class="w-1/2 p-5 flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-xl font-black text-slate-900 font-brand">Sign In</h2>
              <span class="text-[10px] bg-slate-100 text-slate-600 font-bold px-2 py-0.5 rounded-full border border-slate-200">v2.4</span>
            </div>

            <!-- Login Mode Buttons (Mobile vs Gmail) -->
            <div class="bg-slate-100 p-1 rounded-xl flex items-center mb-3 text-xs font-bold text-slate-600">
              <button type="button" id="tabMobile" onclick="switchLoginMode('mobile')" class="flex-1 py-1 rounded-lg bg-white text-slate-900 shadow-sm transition flex items-center justify-center space-x-1 text-[11px]">
                <i class="fa-solid fa-mobile-screen-button text-[10px]"></i>
                <span>Mobile</span>
              </button>
              <button type="button" id="tabGmail" onclick="switchLoginMode('gmail')" class="flex-1 py-1 rounded-lg text-slate-500 hover:text-slate-800 transition flex items-center justify-center space-x-1 text-[11px]">
                <i class="fa-regular fa-envelope text-[10px]"></i>
                <span>Gmail</span>
              </button>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-3" autocomplete="off">
              <!-- Dynamic Identifier Field -->
              <div>
                <label id="loginLabel" class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">
                  Mobile Number
                </label>
                <div class="relative">
                  <input type="tel" id="loginIdentifier" required placeholder="03001234567" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs font-semibold text-slate-800 outline-none focus:border-amber-500 focus:bg-white transition pr-8">
                  <i id="loginIcon" class="fa-solid fa-phone absolute right-3 top-2.5 text-xs text-slate-400"></i>
                </div>
              </div>

              <!-- Password with Eye Toggle -->
              <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Password</label>
                <div class="relative">
                  <input type="password" id="loginPass" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs font-semibold text-slate-800 outline-none focus:border-amber-500 focus:bg-white transition pr-9">
                  <button type="button" onclick="togglePasswordVisibility('loginPass', 'eyeLoginIcon')" class="absolute right-3 top-2.5 text-xs text-slate-400 hover:text-slate-700">
                    <i id="eyeLoginIcon" class="fa-regular fa-eye-slash"></i>
                  </button>
                </div>
              </div>

              <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black py-2.5 rounded-xl text-xs uppercase tracking-wider transition shadow-md shadow-amber-500/20 active:scale-95 flex items-center justify-center space-x-2 mt-2">
                <span>Access Dashboard</span>
                <i class="fa-solid fa-arrow-right text-[10px]"></i>
              </button>
            </form>
          </div>

          <p class="text-[11px] text-slate-500 text-center font-medium mt-4">
            New Member? 
            <button onclick="goToSlide(true)" class="font-bold text-emerald-600 hover:underline">Register Here</button>
          </p>
        </div>

        <!-- ================= PANEL 2: COMPACT SIGN UP ================= -->
        <div class="w-1/2 p-5 flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between mb-2">
              <h2 class="text-xl font-black text-slate-900 font-brand">Create Node</h2>
              <span class="text-[9px] bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded-full">+ $2 Bonus</span>
            </div>

            <form onsubmit="handleSignup(event)" class="space-y-2" autocomplete="off">
              <div>
                <label class="text-[9px] font-bold text-slate-500 uppercase tracking-wider block mb-0.5">Full Name</label>
                <input type="text" id="regName" required placeholder="Ali Khan" class="w-full bg-slate-50 border border-slate-300 rounded-md px-2.5 py-1.5 text-xs font-semibold text-slate-800 outline-none focus:border-emerald-500">
              </div>

              <div>
                <label class="text-[9px] font-bold text-slate-500 uppercase tracking-wider block mb-0.5">Gmail</label>
                <input type="email" id="regGmail" required placeholder="user@gmail.com" class="w-full bg-slate-50 border border-slate-300 rounded-md px-2.5 py-1.5 text-xs font-semibold text-slate-800 outline-none focus:border-emerald-500">
              </div>

              <div>
                <label class="text-[9px] font-bold text-slate-500 uppercase tracking-wider block mb-0.5">Mobile Number</label>
                <input type="tel" id="regMobile" required placeholder="03001234567" class="w-full bg-slate-50 border border-slate-300 rounded-md px-2.5 py-1.5 text-xs font-semibold text-slate-800 outline-none focus:border-emerald-500">
              </div>

              <div>
                <label class="text-[9px] font-bold text-slate-500 uppercase tracking-wider block mb-0.5">Password</label>
                <div class="relative">
                  <input type="password" id="regPass" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-300 rounded-md px-2.5 py-1.5 text-xs font-semibold text-slate-800 outline-none focus:border-emerald-500 pr-8">
                  <button type="button" onclick="togglePasswordVisibility('regPass', 'eyeRegIcon')" class="absolute right-2.5 top-1.5 text-xs text-slate-400 hover:text-slate-700">
                    <i id="eyeRegIcon" class="fa-regular fa-eye-slash"></i>
                  </button>
                </div>
              </div>

              <div>
                <label class="text-[9px] font-bold text-slate-500 uppercase tracking-wider block mb-0.5">Referral Code</label>
                <input type="text" id="regRef" placeholder="VOLT786" class="w-full bg-slate-50 border border-slate-300 rounded-md px-2.5 py-1.5 text-xs font-mono font-bold uppercase text-emerald-600 outline-none focus:border-emerald-500">
              </div>

              <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 text-slate-950 font-black py-2 rounded-xl text-xs uppercase tracking-wider transition shadow-md shadow-emerald-500/20 active:scale-95 mt-1">
                Register &amp; Claim
              </button>
            </form>
          </div>

          <p class="text-[10px] text-slate-500 text-center font-medium mt-2">
            Existing User? 
            <button onclick="goToSlide(false)" class="font-bold text-amber-600 hover:underline">Log In</button>
          </p>
        </div>

      </div>
    </div>
  </main>

  <!-- ================= PROFESSIONAL EXTENDED FOOTER ================= -->
  <footer class="w-full max-w-[360px] text-center text-slate-500 text-[11px] pt-4 pb-2 space-y-2 select-none">
    
    <!-- Status & Encryption Row -->
    <div class="flex items-center justify-center space-x-4">
      <div class="flex items-center space-x-1.5 bg-slate-900/90 border border-slate-800 px-3 py-0.5 rounded-full text-slate-300 shadow-sm text-[10px]">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        <span class="w-2 h-2 rounded-full bg-emerald-400 absolute"></span>
        <span class="font-semibold text-slate-200">Active</span>
      </div>
      <div class="flex items-center space-x-1 text-slate-400 text-[10px]">
        <i class="fa-solid fa-shield-halved text-emerald-400"></i>
        <span>256-Bit SSL Secured</span>
      </div>
    </div>

    <!-- Links Row -->
    <div class="flex items-center justify-center space-x-4 text-[10px] text-slate-400">
      <a href="#" class="hover:text-amber-400 transition">Privacy</a>
      <span>•</span>
      <a href="#" class="hover:text-amber-400 transition">Terms of Service</a>
      <span>•</span>
      <a href="#" class="hover:text-amber-400 transition">Node Support</a>
    </div>

    <!-- Copyright -->
    <div class="text-[9px] text-slate-600 font-medium">
      &copy; 2026 VoltWealth Protocol Ltd. All Rights Reserved.
    </div>
  </footer>

  <script>
    const slider = document.getElementById('sliderWrapper');
    let currentMode = 'mobile';

    // Slide animation between Login and Register
    function goToSlide(isSignup) {
      if (isSignup) {
        slider.style.transform = 'translateX(-50%)';
      } else {
        slider.style.transform = 'translateX(0%)';
      }
    }

    // Toggle Password Visibility (Eye Icon)
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye text-amber-500';
      } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye-slash';
      }
    }

    // Toggle between Mobile and Gmail login input
    function switchLoginMode(mode) {
      currentMode = mode;
      const tabMobile = document.getElementById('tabMobile');
      const tabGmail = document.getElementById('tabGmail');
      const label = document.getElementById('loginLabel');
      const input = document.getElementById('loginIdentifier');
      const icon = document.getElementById('loginIcon');

      if (mode === 'mobile') {
        tabMobile.className = 'flex-1 py-1 rounded-lg bg-white text-slate-900 shadow-sm transition flex items-center justify-center space-x-1 text-[11px]';
        tabGmail.className = 'flex-1 py-1 rounded-lg text-slate-500 hover:text-slate-800 transition flex items-center justify-center space-x-1 text-[11px]';
        label.innerText = 'Mobile Number';
        input.type = 'tel';
        input.placeholder = '03001234567';
        icon.className = 'fa-solid fa-phone absolute right-3 top-2.5 text-xs text-slate-400';
      } else {
        tabGmail.className = 'flex-1 py-1 rounded-lg bg-white text-slate-900 shadow-sm transition flex items-center justify-center space-x-1 text-[11px]';
        tabMobile.className = 'flex-1 py-1 rounded-lg text-slate-500 hover:text-slate-800 transition flex items-center justify-center space-x-1 text-[11px]';
        label.innerText = 'Gmail Address';
        input.type = 'email';
        input.placeholder = 'user@gmail.com';
        icon.className = 'fa-regular fa-envelope absolute right-3 top-2.5 text-xs text-slate-400';
      }
      input.value = '';
      input.focus();
    }

    // Generate Slow & Realistic Live Ticker Feed
    function generateLiveTicker() {
      const names = ['A', 'M', 'K', 'S', 'Z', 'F', 'H', 'R', 'T', 'W', 'B', 'D'];
      const actions = [
        { type: 'deposit', template: (g, amt) => `<span class="text-amber-400 font-bold">${g}</span> has been successfully deposited <strong class="text-emerald-400">$${amt}.00</strong>` },
        { type: 'plan', template: (g, p) => `<span class="text-amber-400 font-bold">${g}</span> has been successfully activated <strong class="text-cyan-400">PLAN ${p}</strong>` },
        { type: 'withdraw', template: (g, amt) => `<span class="text-amber-400 font-bold">${g}</span> has been successfully withdrew <strong class="text-amber-300">$${amt}.00</strong>` }
      ];

      let tickerItems = [];
      for (let i = 0; i < 12; i++) {
        const initial = names[Math.floor(Math.random() * names.length)];
        const hiddenGmail = `${initial}****@gmail.com`;
        const act = actions[i % actions.length];
        
        let content = '';
        if (act.type === 'deposit') {
          content = act.template(hiddenGmail, [6, 12, 25, 50, 100][Math.floor(Math.random() * 5)]);
        } else if (act.type === 'plan') {
          content = act.template(hiddenGmail, Math.floor(Math.random() * 4) + 1);
        } else {
          content = act.template(hiddenGmail, [15, 30, 75, 120, 250][Math.floor(Math.random() * 5)]);
        }
        tickerItems.push(content);
      }

      document.getElementById('liveTicker').innerHTML = tickerItems.join(' &nbsp;&nbsp;•&nbsp;&nbsp; ');
    }
    generateLiveTicker();

    // Auto Erase Data on Window Close or Tab Hide (Security Layer)
    window.addEventListener('beforeunload', () => {
      // Clear sensitive form inputs on page exit
      document.getElementById('loginIdentifier').value = '';
      document.getElementById('loginPass').value = '';
    });

    // Handle User Sign Up
    function handleSignup(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const gmail = document.getElementById('regGmail').value.trim().toLowerCase();
      const mobile = document.getElementById('regMobile').value.trim();
      const pass = document.getElementById('regPass').value;
      const ref = document.getElementById('regRef').value.trim();

      const userData = { name, gmail, mobile, pass, ref };
      sessionStorage.setItem('volt_active_session', JSON.stringify(userData));
      localStorage.setItem('volt_registered_user', JSON.stringify(userData));

      alert('Account registered successfully! Redirecting...');
      window.location.href = 'dashboard.html';
    }

    // Handle User & CEO Secret Login
    function handleLogin(e) {
      e.preventDefault();
      const identifier = document.getElementById('loginIdentifier').value.trim().toLowerCase();
      const pass = document.getElementById('loginPass').value;

      // ================= SECRET CEO GATEWAY =================
      const CEO_GMAIL = 'ceo@voltwealth.com';
      const CEO_PASS = 'admin1234';

      if (identifier === CEO_GMAIL && pass === CEO_PASS) {
        sessionStorage.setItem('volt_auth_role', 'CEO');
        window.location.href = 'ceo-dashboard.html';
        return;
      }

      // ================= REGULAR USER LOGIN =================
      const saved = JSON.parse(localStorage.getItem('volt_registered_user'));

      if (saved) {
        const match = (saved.mobile === identifier || saved.gmail.toLowerCase() === identifier);
        if (match && saved.pass === pass) {
          sessionStorage.setItem('volt_active_session', JSON.stringify(saved));
          sessionStorage.setItem('volt_auth_role', 'USER');
          window.location.href = 'dashboard.html';
          return;
        }
      }

      // Demo User Fallback
      if (identifier && pass) {
        const fallbackName = identifier.includes('@') ? identifier.split('@')[0] : identifier;
        const tempUser = { name: fallbackName, gmail: identifier, mobile: identifier };
        sessionStorage.setItem('volt_active_session', JSON.stringify(tempUser));
        sessionStorage.setItem('volt_auth_role', 'USER');
        window.location.href = 'dashboard.html';
      } else {
        alert('Invalid Credentials!');
      }
    }
  </script>
</body>
</html>
