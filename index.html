<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <!-- Login Card -->
    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-8">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-indigo-600/20 text-indigo-400 mb-3">
                <i class="fas fa-shield-alt text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">अकाउंट लॉगिन</h1>
            <p class="text-slate-400 text-sm mt-1">आगे बढ़ने के लिए अपनी जानकारी दर्ज करें</p>
        </div>

        <!-- Alert / Error Box -->
        <div id="alertBox" class="hidden mb-5 p-4 rounded-xl text-sm border transition-all duration-300">
            <div class="flex items-start gap-3">
                <i id="alertIcon" class="fas fa-exclamation-circle mt-0.5 text-lg"></i>
                <div>
                    <p id="alertMessage" class="font-medium"></p>
                    <button id="lockForgotBtn" onclick="openForgotModal()" class="hidden mt-2 inline-block bg-red-600 hover:bg-red-500 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition">
                        Forgot Password करें
                    </button>
                </div>
            </div>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">ईमेल आईडी (Gmail)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="email" id="email" required placeholder="example@gmail.com"
                        class="w-full pl-10 pr-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-2">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">पासवर्ड</label>
                    <button type="button" onclick="openForgotModal()" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium">
                        Forgot Password?
                    </button>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" id="password" required placeholder="••••••••"
                        class="w-full pl-10 pr-10 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200">
                        <i id="eyeIcon" class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="loginBtn"
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-500 disabled:cursor-not-allowed text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/20 transition duration-200 flex items-center justify-center gap-2">
                <span>लॉगिन करें</span>
                <i class="fas fa-arrow-right text-sm"></i>
            </button>
        </form>
    </div>

    <!-- Forgot Password Modal (Email & Phone OTP) -->
    <div id="forgotModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-700 pb-4 mb-5">
                <h3 class="text-lg font-bold text-white">अकाउंट रिकवरी / पासवर्ड रीसेट</h3>
                <button onclick="closeForgotModal()" class="text-slate-400 hover:text-white">
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>

            <!-- Method Switcher Tabs -->
            <div class="grid grid-cols-2 gap-2 bg-slate-900 p-1 rounded-xl mb-5">
                <button type="button" id="tabEmail" onclick="switchRecoveryTab('email')" class="py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition">
                    <i class="fas fa-envelope mr-1"></i> रजिस्टर्ड ईमेल
                </button>
                <button type="button" id="tabPhone" onclick="switchRecoveryTab('phone')" class="py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition">
                    <i class="fas fa-mobile-alt mr-1"></i> फोन नंबर (OTP)
                </button>
            </div>

            <!-- Modal Status Message -->
            <div id="modalAlert" class="hidden mb-4 p-3 rounded-lg text-xs"></div>

            <!-- Email Reset Section -->
            <div id="emailRecoverySection" class="space-y-4">
                <p class="text-xs text-slate-400">अपना रजिस्टर्ड Gmail दर्ज करें। हम आपको पासवर्ड रीसेट लिंक भेजेंगे।</p>
                <input type="email" id="resetEmail" placeholder="registered@gmail.com"
                    class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-indigo-500">
                <button type="button" onclick="sendEmailReset()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl transition">
                    ईमेल पर रीसेट लिंक भेजें
                </button>
            </div>

            <!-- Phone OTP Section -->
            <div id="phoneRecoverySection" class="hidden space-y-4">
                <p class="text-xs text-slate-400">कंट्री कोड के साथ रजिस्टर्ड नंबर लिखें (जैसे: +923001234567 या +919876543210)</p>
                <input type="tel" id="resetPhone" placeholder="+923001234567"
                    class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-indigo-500">
                
                <!-- Invisible/Visible Recaptcha Container for Firebase Phone Auth -->
                <div id="recaptcha-container"></div>

                <button type="button" id="sendOtpBtn" onclick="sendPhoneOTP()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold rounded-xl transition">
                    OTP भेजें
                </button>

                <!-- OTP Verification Box (Shown after OTP sent) -->
                <div id="otpVerifyBox" class="hidden pt-3 border-t border-slate-700 space-y-3">
                    <input type="text" id="otpCode" maxlength="6" placeholder="6-अंकों का OTP दर्ज करें"
                        class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-center tracking-widest text-white focus:outline-none focus:border-emerald-500">
                    <button type="button" onclick="verifyPhoneOTP()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl transition">
                        OTP वेरीफाई करें और लॉक खोलें
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            sendPasswordResetEmail,
            RecaptchaVerifier,
            signInWithPhoneNumber
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // 1. अपनी Firebase Config यहाँ पेस्ट करें
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 2. CEO का आधिकारिक Gmail (और Redirect पेज)
        const CEO_EMAIL = "ceo@yourdomain.com"; // <-- यहाँ CEO का Firebase वाला Gmail लिखें
        const CEO_DASHBOARD_URL = "ceo-dashboard.html";
        const USER_DASHBOARD_URL = "dashboard.html";

        // 3. Silent Security State (कहीं भी शो नहीं होगा)
        const MAX_ATTEMPTS = 3;
        const STORAGE_KEY = "auth_session_guard_v1";

        function getSecurityState() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : { attempts: 0, locked: false };
        }

        function saveSecurityState(state) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function resetSecurityLock() {
            saveSecurityState({ attempts: 0, locked: false });
            const loginBtn = document.getElementById("loginBtn");
            loginBtn.disabled = false;
            document.getElementById("lockForgotBtn").classList.add("hidden");
        }

        // UI Alert Helper
        function showAlert(message, type = "error", showForgotBtn = false) {
            const box = document.getElementById("alertBox");
            const msg = document.getElementById("alertMessage");
            const icon = document.getElementById("alertIcon");
            const forgotBtn = document.getElementById("lockForgotBtn");

            box.classList.remove("hidden", "bg-red-950/60", "border-red-500/50", "text-red-200", "bg-amber-950/60", "border-amber-500/50", "text-amber-200", "bg-emerald-950/60", "border-emerald-500/50", "text-emerald-200");

            if (type === "locked") {
                box.classList.add("bg-red-950/80", "border-red-500", "text-red-200");
                icon.className = "fas fa-lock mt-0.5 text-lg text-red-400";
            } else if (type === "warning") {
                box.classList.add("bg-amber-950/60", "border-amber-500/50", "text-amber-200");
                icon.className = "fas fa-exclamation-triangle mt-0.5 text-lg text-amber-400";
            } else if (type === "success") {
                box.classList.add("bg-emerald-950/60", "border-emerald-500/50", "text-emerald-200");
                icon.className = "fas fa-check-circle mt-0.5 text-lg text-emerald-400";
            }

            msg.textContent = message;
            if (showForgotBtn) {
                forgotBtn.classList.remove("hidden");
            } else {
                forgotBtn.classList.add("hidden");
            }
        }

        // पेज लोड होते ही चेक करें कि अकाउंट पहले से लॉक तो नहीं है
        function enforceLockCheck() {
            const state = getSecurityState();
            if (state.locked || state.attempts >= MAX_ATTEMPTS) {
                document.getElementById("loginBtn").disabled = true;
                showAlert(
                    "आपने बार-बार गलत आईडी या पासवर्ड डाला है। सुरक्षा कारणों से आपका लॉगिन रोक दिया गया है। कृपया अपना अकाउंट खोलने के लिए Forgot Password करें।",
                    "locked",
                    true
                );
                return true;
            }
            return false;
        }

        enforceLockCheck();

        // 4. Login Form Submission
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            if (enforceLockCheck()) return;

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const loginBtn = document.getElementById("loginBtn");

            loginBtn.disabled = true;
            loginBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> जाँच की जा रही है...`;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // सफल लॉगिन पर काउंटर रीसेट करें
                resetSecurityLock();
                showAlert("लॉगिन सफल! आपको डैशबोर्ड पर भेजा जा रहा है...", "success");

                // CEO चेक करें (Direct Email Match या Firestore Role Match)
                let isCEO = (user.email.toLowerCase() === CEO_EMAIL.toLowerCase());

                if (!isCEO) {
                    // वैकल्पिक: यदि आपने Firestore में 'users' कलेक्शन में role: 'ceo' रखा है
                    try {
                        const userDoc = await getDoc(doc(db, "users", user.uid));
                        if (userDoc.exists() && userDoc.data().role === "ceo") {
                            isCEO = true;
                        }
                    } catch (err) {
                        // Firestore चेक वैकल्पिक है
                    }
                }

                setTimeout(() => {
                    window.location.href = isCEO ? CEO_DASHBOARD_URL : USER_DASHBOARD_URL;
                }, 800);

            } catch (error) {
                // गलत आईडी या पासवर्ड पर काउंटर बढ़ाएं
                const state = getSecurityState();
                state.attempts += 1;

                if (state.attempts >= MAX_ATTEMPTS) {
                    state.locked = true;
                    saveSecurityState(state);
                    loginBtn.disabled = true;
                    loginBtn.innerHTML = `<span>लॉगिन बंद है</span> <i class="fas fa-lock text-sm"></i>`;
                    showAlert(
                        "आपने 3 बार गलत पासवर्ड या आईडी डाली है। सुरक्षा के तहत अब आप लॉगिन नहीं कर सकते। कृपया नीचे दिए गए बटन से Forgot Password करें।",
                        "locked",
                        true
                    );
                } else {
                    saveSecurityState(state);
                    const remaining = MAX_ATTEMPTS - state.attempts;
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = `<span>लॉगिन करें</span> <i class="fas fa-arrow-right text-sm"></i>`;
                    showAlert(
                        `गलत ईमेल आईडी या पासवर्ड! आपके पास केवल ${remaining} कोशिश बाकी है।`,
                        "warning",
                        false
                    );
                }
            }
        });

        // 5. Email Password Reset Logic
        window.sendEmailReset = async function () {
            const resetEmail = document.getElementById("resetEmail").value.trim();
            const modalAlert = document.getElementById("modalAlert");

            if (!resetEmail) {
                showModalAlert("कृपया अपना रजिस्टर्ड ईमेल दर्ज करें।", "error");
                return;
            }

            try {
                await sendPasswordResetEmail(auth, resetEmail);
                // रीसेट लिंक भेजने पर लॉक हटा दें ताकि नया पासवर्ड डालकर लॉगिन हो सके
                resetSecurityLock();
                showModalAlert("पासवर्ड रीसेट लिंक आपके ईमेल पर भेज दिया गया है! अपना इनबॉक्स (या Spam फोल्डर) चेक करें और नया पासवर्ड सेट करके लॉगिन करें।", "success");
                showAlert("रीसेट लिंक भेज दिया गया है। नया पासवर्ड बनाने के बाद अब आप लॉगिन कर सकते हैं।", "success", false);
            } catch (error) {
                showModalAlert("त्रुटि: यह ईमेल रजिस्टर्ड नहीं है या अमान्य है।", "error");
            }
        };

        // 6. Phone Number OTP Recovery Logic
        let confirmationResultGlobal = null;

        window.sendPhoneOTP = async function () {
            const phoneNumber = document.getElementById("resetPhone").value.trim();
            if (!phoneNumber || !phoneNumber.startsWith("+")) {
                showModalAlert("कृपया कंट्री कोड के साथ सही नंबर लिखें (जैसे: +923001234567 या +919876543210)।", "error");
                return;
            }

            try {
                if (!window.recaptchaVerifier) {
                    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
                        'size': 'invisible'
                    });
                }

                const sendBtn = document.getElementById("sendOtpBtn");
                sendBtn.disabled = true;
                sendBtn.textContent = "OTP भेजा जा रहा है...";

                confirmationResultGlobal = await signInWithPhoneNumber(auth, phoneNumber, window.recaptchaVerifier);
                
                document.getElementById("otpVerifyBox").classList.remove("hidden");
                sendBtn.textContent = "OTP दोबारा भेजें";
                sendBtn.disabled = false;
                showModalAlert("आपके मोबाइल नंबर पर 6-अंकों का OTP भेज दिया गया है।", "success");
            } catch (error) {
                document.getElementById("sendOtpBtn").disabled = false;
                document.getElementById("sendOtpBtn").textContent = "OTP भेजें";
                showModalAlert("OTP भेजने में समस्या आई: " + error.message, "error");
            }
        };

        window.verifyPhoneOTP = async function () {
            const code = document.getElementById("otpCode").value.trim();
            if (!code || code.length < 6) {
                showModalAlert("कृपया 6-अंकों का सही OTP दर्ज करें।", "error");
                return;
            }

            try {
                await confirmationResultGlobal.confirm(code);
                // OTP वेरीफाई होते ही अकाउंट अनलॉक करें और ईमेल रीसेट का विकल्प दें
                resetSecurityLock();
                showModalAlert("OTP वेरीफाई हो गया है! आपका लॉगिन लॉक खोल दिया गया है। अब आप अपना ईमेल पासवर्ड रीसेट कर सकते हैं या लॉगिन कर सकते हैं।", "success");
                showAlert("मोबाइल OTP वेरीफाई हो गया है। अब आप लॉगिन कर सकते हैं।", "success", false);
                setTimeout(() => closeForgotModal(), 2000);
            } catch (error) {
                showModalAlert("गलत OTP! कृपया मैसेज चेक करके दोबारा डालें।", "error");
            }
        };

        function showModalAlert(msg, type) {
            const el = document.getElementById("modalAlert");
            el.classList.remove("hidden", "bg-red-950", "text-red-300", "border-red-500", "bg-emerald-950", "text-emerald-300", "border-emerald-500");
            el.classList.add("border");
            if (type === "success") {
                el.classList.add("bg-emerald-950", "text-emerald-300", "border-emerald-500");
            } else {
                el.classList.add("bg-red-950", "text-red-300", "border-red-500");
            }
            el.textContent = msg;
        }
    </script>

      <!-- UI Helper Scripts -->
    <script>
        function togglePassword() {
            const pwd = document.getElementById("password");
            const icon = document.getElementById("eyeIcon");
            if (pwd.type === "password") {
                pwd.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                pwd.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        function openForgotModal() {
            const modal = document.getElementById("forgotModal");
            modal.classList.remove("hidden");
            modal.classList.add("flex");
            // लॉगिन बॉक्स में लिखा ईमेल ऑटो-फिल कर दें
            const currentEmail = document.getElementById("email").value;
            if (currentEmail) document.getElementById("resetEmail").value = currentEmail;
        }

        function closeForgotModal() {
            const modal = document.getElementById("forgotModal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        }

        function switchRecoveryTab(tab) {
            const emailSec = document.getElementById("emailRecoverySection");
            const phoneSec = document.getElementById("phoneRecoverySection");
            const tabEmail = document.getElementById("tabEmail");
            const tabPhone = document.getElementById("tabPhone");

            document.getElementById("modalAlert").classList.add("hidden");

            if (tab === "email") {
                emailSec.classList.remove("hidden");
                phoneSec.classList.add("hidden");
                tabEmail.classList.add("bg-indigo-600", "text-white");
                tabEmail.classList.remove("text-slate-400");
                tabPhone.classList.remove("bg-indigo-600", "text-white");
                tabPhone.classList.add("text-slate-400");
            } else {
                phoneSec.classList.remove("hidden");
                emailSec.classList.add("hidden");
                tabPhone.classList.add("bg-indigo-600", "text-white");
                tabPhone.classList.remove("text-slate-400");
                tabEmail.classList.remove("bg-indigo-600", "text-white");
                tabEmail.classList.add("text-slate-400");
            }
        }
    </script>
</body>
</html>
